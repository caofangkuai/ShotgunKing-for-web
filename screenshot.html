<!DOCTYPE html>
<html>
<head><title>Screenshot</title></head>
<body style="margin:0;background:#000">
<canvas id="c" width="320" height="180" style="width:640px;height:360px"></canvas>
<script>
// Wait for game to load then capture
setTimeout(function() {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  if (window.Sugar && window.Sugar.canvas) {
    ctx.drawImage(window.Sugar.canvas, 0, 0);
    var data = canvas.toDataURL('image/png');
    document.body.innerHTML = '<img src="' + data + '" style="width:640px;height:360px">';
    window.CAPTURE_DATA = data;
  }
}, 8000);
</script>
</body>
</html>
